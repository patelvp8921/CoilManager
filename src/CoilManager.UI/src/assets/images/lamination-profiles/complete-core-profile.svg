<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 680" role="img" aria-labelledby="title desc">
<title id="title">Complete lamination core plate assembly</title><desc id="desc">Top, bottom, two side and center plates combined into a transformer core.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#5b9bd5"/></marker><style>.plate{fill:#edf6ff;stroke:#4f94cf;stroke-width:5;stroke-linejoin:round}.edge{fill:#dceeff}.dim{stroke:#5b9bd5;stroke-width:1.7;marker-start:url(#arrow);marker-end:url(#arrow)}.guide{stroke:#9abbd7;stroke-width:1.2;stroke-dasharray:4 4}.label{font:600 17px Arial,sans-serif;fill:#17365f}.small{font:14px Arial,sans-serif;fill:#425466}.title{font:700 22px Arial,sans-serif;fill:#17365f}</style></defs>
<rect width="520" height="680" fill="white"/>
<path class="plate" d="M50 85 H470 L380 185 H305 L260 155 L215 185 H140 Z"/><path class="plate" d="M140 495 H215 L260 525 L305 495 H380 L470 595 H50 Z"/>
<path class="plate edge" d="M50 85 L140 185 V495 L50 595 Z"/><path class="plate edge" d="M470 85 L380 185 V495 L470 595 Z"/><path class="plate" d="M215 185 L260 155 L305 185 V495 L260 525 L215 495 Z"/>
<rect x="157" y="207" width="41" height="266" rx="3" fill="white" stroke="#b8ccde" stroke-width="2"/><rect x="322" y="207" width="41" height="266" rx="3" fill="white" stroke="#b8ccde" stroke-width="2"/>
<text x="260" y="120" text-anchor="middle" class="label">TOP</text><text x="260" y="568" text-anchor="middle" class="label">BOTTOM</text>
<text x="95" y="348" text-anchor="middle" transform="rotate(-90 95 348)" class="label">SIDE</text><text x="425" y="348" text-anchor="middle" transform="rotate(90 425 348)" class="label">SIDE</text><text x="260" y="348" text-anchor="middle" transform="rotate(-90 260 348)" class="label">CENTER</text>
<line x1="50" y1="45" x2="470" y2="45" class="dim"/><text x="260" y="36" text-anchor="middle" class="small">Core Width</text><line x1="490" y1="85" x2="490" y2="595" class="dim"/><text x="509" y="340" text-anchor="middle" transform="rotate(90 509 340)" class="small">Core Height</text>
<line x1="50" y1="55" x2="50" y2="77" class="guide"/><line x1="470" y1="55" x2="470" y2="77" class="guide"/><line x1="478" y1="85" x2="484" y2="85" class="guide"/><line x1="478" y1="595" x2="484" y2="595" class="guide"/>
<g transform="translate(84 625)"><rect width="352" height="34" rx="17" fill="#eef4ff"/><text x="176" y="22" text-anchor="middle" class="small">Top-Bottom + Side + Center laminations</text></g></svg>