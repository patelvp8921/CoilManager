<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 680" role="img" aria-labelledby="title desc">
<title id="title">Complete lamination core plate assembly</title><desc id="desc">Top, bottom, two side and center plates combined into a transformer core.</desc>
