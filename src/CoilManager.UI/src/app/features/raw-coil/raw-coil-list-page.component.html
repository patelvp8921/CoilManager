<section class="page-header">
  <div>
    <h1>Raw Coils</h1>
    <p>Inventory intake placeholder</p>
  </div>

  <a mat-flat-button color="primary" routerLink="/raw-coils/create">
    <mat-icon>add</mat-icon>
    New Raw Coil
  </a>
</section>

<mat-card appearance="outlined" class="table-panel">
  <mat-card-content>
    <table mat-table [dataSource]="dataSource">
      @for (column of columns; track column.key) {
        <ng-container [matColumnDef]="column.key">
          <th mat-header-cell *matHeaderCellDef>{{ column.label }}</th>
          <td mat-cell *matCellDef="let row">{{ row[column.key] }}</td>
        </ng-container>
      }

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <div class="empty-state">
      <mat-icon>inventory</mat-icon>
      <h2>No raw coils yet</h2>
      <p>Raw coil records will appear here when CRUD is implemented.</p>
    </div>
  </mat-card-content>
</mat-card>
