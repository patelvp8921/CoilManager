<mat-card appearance="outlined" class="summary-card production-summary-card">
  <mat-card-header>
    <div class="widget-heading">
      <mat-icon>factory</mat-icon>
      <div>
        <mat-card-title>Production Summary</mat-card-title>
        <mat-card-subtitle>Current manufacturing execution status</mat-card-subtitle>
      </div>
    </div>
  </mat-card-header>

  <mat-card-content class="production-sections">
    @for (area of displaySections(); track area.id) {
      <section class="production-area" [attr.aria-labelledby]="'production-area-' + area.id">
        <header>
          <mat-icon>{{ area.icon }}</mat-icon>
          <h3 [id]="'production-area-' + area.id">{{ area.title }}</h3>
        </header>
        <div class="status-grid">
          @for (status of area.statuses; track status.label) {
            <button type="button" class="status-metric" [class]="status.tone" [disabled]="!status.route"
              [attr.aria-label]="area.title + ', ' + status.label + ': ' + status.value"
              (click)="selectStatus(area, status)">
              <span>{{ status.label }}</span>
              <strong>{{ status.value }}</strong>
            </button>
          }
        </div>
      </section>
    }
  </mat-card-content>
</mat-card>
