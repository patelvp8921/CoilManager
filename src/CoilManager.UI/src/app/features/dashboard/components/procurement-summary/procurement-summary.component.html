<mat-card appearance="outlined" class="summary-card">
  <mat-card-header>
    <mat-card-title><mat-icon>shopping_cart</mat-icon>Procurement Summary</mat-card-title>
    <mat-chip>{{ procurement.status }}</mat-chip>
  </mat-card-header>
  <mat-card-content class="metric-list">
    <div><span>Pending Receipts</span><strong>{{ procurement.pendingReceipts }}</strong></div>
    <div><span>Suppliers</span><strong>{{ procurement.suppliers }}</strong></div>
    <div><span>Incoming Weight</span><strong>{{ procurement.incomingWeight | number:'1.3-3' }}</strong></div>
  </mat-card-content>
</mat-card>
